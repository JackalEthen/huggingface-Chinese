<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --ink: #191917;
    --sub: #71716A;
    --line: #E9E6DC;
    --accent: #FFD21E;
    --on-accent: #2B2100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1F1F1D; --ink: #F2F1EC;
      --sub: #9C9C94; --line: #30302C;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 336px; padding: 14px;
    font: 14px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  header { display: flex; align-items: center; gap: 11px; padding: 2px 2px 13px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700; letter-spacing: -0.5px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.14);
  }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
  .tagline { font-size: 11.5px; color: var(--sub); margin-top: 1px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 13px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    overflow: hidden;
  }

  .row-main {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 13px;
  }
  .t { font-weight: 600; font-size: 13.5px; }
  .d { font-size: 11.5px; color: var(--sub); margin-top: 2px; }

  .switch { position: relative; width: 42px; height: 23px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .18s; }
  .switch .knob {
    position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.28);
    transition: transform .18s cubic-bezier(.3,.9,.4,1.2), background .18s;
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .knob { transform: translateX(19px); background: var(--on-accent); }

  .stats { display: flex; border-top: 1px solid var(--line); transition: opacity .2s; }
  .stat { flex: 1; padding: 11px 16px 12px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .num { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  .lbl { font-size: 10.5px; color: var(--sub); margin-top: 1px; }

  .settings-btn {
    margin-top: 11px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 11px; border-radius: 11px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink);
    transition: border-color .15s, transform .1s;
  }
  .settings-btn:hover { border-color: var(--accent); }
  .settings-btn:active { transform: translateY(1px); }

  .hint { text-align: center; font-size: 10.5px; color: var(--sub); margin-top: 9px; transition: opacity .2s; }
  body.off .stats, body.off .hint { opacity: .45; }

  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 11px; }
  .link-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 8px; border-radius: 11px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
    text-decoration: none; white-space: nowrap;
    transition: border-color .15s, transform .1s;
  }
  .link-btn:hover { border-color: var(--accent); }
  .link-btn:active { transform: translateY(1px); }
  .link-btn:disabled { opacity: .6; cursor: default; }
  .link-btn svg { flex: none; }

  .update-msg {
    text-align: center; font-size: 10.5px; margin-top: 7px;
    min-height: 14px; color: var(--sub);
  }
  .update-msg.ok { color: #2E7D46; }
  .update-msg.err { color: #B3372B; }
</style>
</head>
<body>
  <header>
    <div class="logo">HF</div>
    <div>
      <h1>HF 中文</h1>
      <div class="tagline">huggingface.co / hf-mirror.com</div>
    </div>
  </header>

  <div class="card">
    <div class="row-main">
      <div>
        <div class="t">中文界面翻译</div>
        <div class="d">关闭后立即恢复英文，无需刷新</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="track"></span>
        <span class="knob"></span>
      </label>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="dict-count">—</div><div class="lbl">词典词条</div></div>
      <div class="stat"><div class="num" id="dict-ver">—</div><div class="lbl">词典更新</div></div>
    </div>
  </div>

  <button class="settings-btn" id="open-options">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    API 与词典设置
  </button>

  <div class="links">
    <button class="link-btn" id="check-update">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      检查更新
    </button>
    <a class="link-btn" id="star" href="https://github.com/JackalEthen/huggingface-Chinese" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
      点个 Star
    </a>
  </div>
  <div class="update-msg" id="update-msg"></div>

  <div class="hint">在设置页配置 API 后，可一键翻译模型卡 README</div>

  <script src="popup.js"></script>
</body>
</html>
