<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>HF 中文 · 设置</title>
<style>
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --ink: #191917;
    --sub: #71716A;
    --line: #E9E6DC;
    --accent: #FFD21E;
    --on-accent: #2B2100;
    --ok: #2E7D46;
    --err: #B3372B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1F1F1D; --ink: #F2F1EC;
      --sub: #9C9C94; --line: #30302C;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; padding: 40px 20px;
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 13px; margin-bottom: 30px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center;
    font-size: 19px; font-weight: 700; letter-spacing: -0.5px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.14);
  }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { font-size: 12.5px; color: var(--sub); margin-top: 2px; }

  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 15px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    padding: 24px;
    margin-bottom: 18px;
  }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  h2 { font-size: 15px; font-weight: 700; }
  .sec-desc { font-size: 12.5px; color: var(--sub); margin-bottom: 18px; }

  .field { margin-bottom: 15px; }
  .field:last-of-type { margin-bottom: 0; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 10px 12px;
    font: inherit; font-size: 13.5px;
    color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 10px;
    outline: none; transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select { cursor: pointer; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font: inherit; font-size: 13.5px; font-weight: 600;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    transition: border-color .15s, transform .1s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }

  .status {
    margin-top: 14px; padding: 10px 12px; border-radius: 9px;
    font-size: 12.5px; display: none; align-items: center; gap: 8px;
  }
  .status.show { display: flex; }
  .status.ok { color: var(--ok); background: rgba(46,125,70,.1); }
  .status.err { color: var(--err); background: rgba(179,55,43,.1); }
  .status.pending { color: var(--sub); background: rgba(0,0,0,.05); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  .dict-stat { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; }
  .dict-stat + .dict-stat { border-top: 1px solid var(--line); }
  .k { font-size: 13.5px; }
  .v { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .security-note {
    display: flex; gap: 10px; margin-top: 16px; padding: 12px 14px;
    background: rgba(255,210,30,.08); border: 1px solid rgba(255,210,30,.35);
    border-radius: 10px; font-size: 12px; color: var(--ink);
  }
  .security-note svg { flex: none; margin-top: 1px; }

  footer { text-align: center; font-size: 11.5px; color: var(--sub); margin-top: 26px; }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">HF</div>
    <div>
      <h1>HF 中文 · 设置</h1>
      <div class="sub">API 用于翻译模型卡 README，密钥仅保存在本机</div>
    </div>
  </header>

  <section>
    <div class="sec-head"><h2>翻译 API</h2></div>
    <p class="sec-desc">选择服务商预设后自动填入接口地址与默认模型，也可自由修改。</p>

    <div class="field">
      <label for="preset">服务商</label>
      <select id="preset">
        <option value="deepseek">DeepSeek</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="qwen">阿里 Qwen（DashScope）</option>
        <option value="openrouter">OpenRouter</option>
        <option value="custom">自定义</option>
      </select>
    </div>

    <div class="field">
      <label for="baseurl">接口地址 Base URL</label>
      <input type="text" id="baseurl" placeholder="https://api.deepseek.com/v1">
    </div>

    <div class="row2">
      <div class="field">
        <label for="model">模型</label>
        <input type="text" id="model" placeholder="deepseek-chat">
      </div>
      <div class="field">
        <label for="apikey">API Key</label>
        <input type="password" id="apikey" placeholder="sk-..." autocomplete="off">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="test">测试连接</button>
      <button class="btn" id="save">保存</button>
    </div>

    <div class="status pending" id="status">
      <span class="dot"></span><span id="status-text"></span>
    </div>

    <div class="security-note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <div>API Key 使用本机随机密钥 AES-GCM 加密后存储，不会上传到任何服务器。</div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>词典状态</h2></div>
    <p class="sec-desc">词典随仓库自动更新，也可以手动检查。</p>

    <div class="dict-stat"><span class="k">内置词条</span><span class="v" id="bundled-count">—</span></div>
    <div class="dict-stat"><span class="k">本地词条（含更新）</span><span class="v" id="local-count">—</span></div>
    <div class="dict-stat"><span class="k">词典版本</span><span class="v" id="dict-ver">—</span></div>
    <div class="dict-stat"><span class="k">检查更新</span>
      <button class="btn" id="check-update">立即检查</button>
    </div>

    <div class="status" id="dict-status"><span class="dot"></span><span id="dict-status-text"></span></div>
  </section>

  <footer>HF 中文 · <span id="ver"></span> · 反馈请前往 <a href="https://github.com/JackalEthen/huggingface-Chinese/issues" target="_blank" rel="noopener">GitHub Issues</a></footer>
</div>

<script src="options.js"></script>
</body>
</html>
